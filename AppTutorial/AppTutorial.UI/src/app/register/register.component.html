<div class="container-fluid">
    <div class="row">
        <div class="col-lg-4"></div>
        <div class="col-lg-4">
            <form [formGroup]="registerForm" (ngSubmit)="register()">
                <div class="form-group">
                    <label for="inputEmail">Email</label>
                    <input type="email" required minlength="5" maxlength="50" class="form-control" formControlName="email" placeholder="Enter email">
                    <div *ngIf="email?.touched && email?.errors" class="alert alert-danger">
                        This field is required!
                    </div>
                </div>
                <div class="form-group">
                    <label for="inputUsername">Username</label>
                    <input type="text" required minlength="5" maxlength="50" class="form-control" formControlName="username" placeholder="Enter username">
                    <div *ngIf="username?.touched && username?.errors" class="alert alert-danger">
                        This field is required!
                    </div>
                </div>
                <div class="form-group">
                    <label for="inputPassword">Password</label>
                    <input type="password" required minlength="6" maxlength="50" class="form-control" formControlName="password" placeholder="Enter password">
                    <div *ngIf="password?.touched && password?.errors" class="alert alert-danger">
                        This field is required!
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" required minlength="6" maxlength="50" class="form-control" formControlName="confirmPassword" placeholder="Enter password again">
                    <div *ngIf="confirmPassword?.touched && confirmPassword?.errors" class="alert alert-danger">
                        This field is required!
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
        <div class="col-lg-4"></div>
    </div>
</div>
